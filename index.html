<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MADE BY VANDERHOORN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ---------- Global reset ---------- */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body {
  /* font-family:Arial,Helvetica,sans-serif; */
  font-family: 'Cambria';
  background:#cfcfcf;
  color:#333;
}

/* ---------- Header ---------- */
header{
  background:#006688;
  color:#fff;
  padding:1.5rem 1rem;
  text-align:center;
}
header h1{font-size:2rem;}

/* ---------- Gallery layout ---------- */
.gallery{
  display:grid;
  gap:1rem;
  padding:1rem;
  max-width:1200px;
  margin:auto;
}
@media (min-width:600px){ .gallery{grid-template-columns:repeat(2,1fr);} }
@media (min-width:900px){ .gallery{grid-template-columns:repeat(3,1fr);} }
@media (min-width:1200px){ .gallery{grid-template-columns:repeat(4,1fr);} }

/* ---------- Card (image box) ---------- */
.card{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  transition:transform .2s ease, box-shadow .2s ease;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 6px 12px rgba(0,0,0,.2);
}
.card img{
  display:block;
  width:100%;
  height:auto;
}

/* ----- Hover overlay (top‑bottom wipe) ----- */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  /* Two linear gradients – one from the top, one from the bottom.
     They start with 0% height (invisible) and expand to 50% each side on hover. */
  background:
    linear-gradient(to bottom, rgba(0, 128, 128, 0.8) 70%, transparent 90%) top,
    linear-gradient(to top,    rgba(0, 128, 128, 0.8) 70%, transparent 90%) bottom;
  background-repeat:no-repeat;
  background-size:100% 0%;          /* height = 0% initially */
  transition:background-size .35s ease;
}

/* When hovering, each gradient grows to cover half the card,
   meeting in the centre. */
.card:hover::before{
  background-size:100% 50%;        /* 50% from top + 50% from bottom = full height */
}

/* ----- Caption (visible on hover) ----- */
.caption{
  font-family: 'Cambria';
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#000000;
  text-argb(0, 0, 0):center;
  opacity:0;
  transition:opacity .3s ease;
}
.card:hover .caption{opacity:1;}

/* Title & subtitle styling */
.caption .title{font-size:1.5rem;font-weight:500;}
.caption .subtitle{
  font-size:1.0rem;
  font-weight:300;
  margin-top:0.3rem;
}
</style>
</head>

<body>

<header>
  <h1>MADE BY VANDERHOORN</h1>
</header>

<section class="gallery">
  <!-- Card 1 -->
  <div class="card">
    <a href="https://svdhoorn.github.io/runninghexagons/" target="_blank" rel="noopener noreferrer">
    <img src="images/runninghexagons.PNG" alt="Running Hexagons">
    <div class="caption">
      <span class="title">Running Hexagons</span> 
      <span class="subtitle">Where did I run</span>
    </div>
    </a>
  </div>


  <!-- Card 2 -->
  <div class="card">
    <a href="https://svdhoorn.github.io/runningregions/" target="_blank" rel="noopener noreferrer">
    <img src="images/runningregions.PNG" alt="Running Regions">
    <div class="caption">
      <span class="title">Running Regions</span> 
      <span class="subtitle">Which regions did I run</span>
    </div>
        </a>
  </div>

  <!-- Card 3 -->
  <div class="card">
        <a href="https://svdhoorn.github.io/runningklompenpaden/" target="_blank" rel="noopener noreferrer">
    <img src="images/runningklompenpaden.png" alt="Running Klompenpaden">
    <div class="caption">
      <span class="title">Running Klompenpaden</span> 
      <span class="subtitle">Which klompenpaden did I run</span>
    </div>
            </a>
  </div>

  <!-- Add more .card blocks as needed -->
</section>

</body>
</html>
